name: Process
on:
  schedule:
    # Every 6 hours UTC = 08:00/14:00/20:00/02:00 Asia/Shanghai
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: aggregator-process
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  # Used by the GitHub crawl channel for public code/search APIs
  GH_TOKEN: ${{ secrets.PUSH_TOKEN }}
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        # Write the secret config to a temp file (process.py expects a path or URL, not raw JSON).
        # Do not use --overwrite, so the last successful Gist is re-imported as a baseline.
        # process.py only pushes after a successful conversion with live nodes, so a failed
        # or empty run keeps the previous Gist content.
        run: |
          python3 -c 'import os, pathlib; pathlib.Path("/tmp/subscribe-conf.json").write_text(os.environ["SUBSCRIBE_CONF"])'
          python -u subscribe/process.py -s /tmp/subscribe-conf.json

      - name: Timestamp
        if: always()
        run: date
